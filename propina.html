<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de propina | Mi Calculadora</title><meta name="description" content="Calcula la propina y el total de una cuenta."><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html">Mi Calculadora</a></div></header><main class="container calc-wrap"><div class="calc"><h1>Calculadora de propina</h1><p>Calcula la propina y el total de una cuenta.</p><div class='field'><label>Cuenta (€)</label><input id='c' type='number' value='50'></div><div class='field'><label>Propina (%)</label><input id='p' type='number' value='10'></div><button class='btn' onclick="let c=+v('c'),p=+v('p'),t=c*p/100;setResult('r',`Propina: <b>${€(t)}</b><br>Total: <b>${€(c+t)}</b>`)">Calcular</button><div id="r" class="result">Pulsa calcular.</div></div><a class="back" href="index.html">← Volver a todas las calculadoras</a></main><script src="app.js"></script></body></html>
