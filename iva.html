<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de IVA | Mi Calculadora</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html">Mi Calculadora</a></div></header><main class="container calc-wrap"><div class="calc"><h1>Calculadora de IVA</h1><p>Añade IVA a una cantidad y obtén base, impuesto y total.</p><div class="field"><label>Precio sin IVA (€)</label><input id="n" type="number" value="100"></div><div class="field"><label>IVA (%)</label><input id="p" type="number" value="21"></div><button class="btn" onclick="iva()">Calcular</button><div id="r" class="result">Pulsa calcular.</div></div><a class="back" href="index.html">← Volver</a></main><script src="app.js"></script></body></html>
