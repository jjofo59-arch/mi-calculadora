<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de calorías | Mi Calculadora</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html">Mi Calculadora</a></div></header><main class="container calc-wrap"><div class="calc"><h1>Calculadora de calorías</h1><p>Estimación orientativa del gasto calórico diario.</p><div class="field"><label>Peso (kg)</label><input id="w" type="number" value="70"></div><div class="field"><label>Altura (cm)</label><input id="h" type="number" value="175"></div><div class="field"><label>Edad</label><input id="a" type="number" value="35"></div><div class="field"><label>Sexo</label><select id="s"><option value="h">Hombre</option><option value="m">Mujer</option></select></div><div class="field"><label>Actividad</label><select id="act"><option value="1.2">Sedentaria</option><option value="1.375">Ligera</option><option value="1.55">Moderada</option><option value="1.725">Alta</option></select></div><button class="btn" onclick="cal()">Calcular</button><div id="r" class="result">Pulsa calcular.</div></div><a class="back" href="index.html">← Volver</a></main><script src="app.js"></script></body></html>
