<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de descuento | Mi Calculadora</title><meta name="description" content="Calcula el precio final y cuánto ahorras con un descuento."><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html">Mi Calculadora</a></div></header><main class="container calc-wrap"><div class="calc"><h1>Calculadora de descuento</h1><p>Calcula el precio final y cuánto ahorras con un descuento.</p><div class='field'><label>Precio (€)</label><input id='p' type='number' value='100'></div><div class='field'><label>Descuento (%)</label><input id='d' type='number' value='20'></div><button class='btn' onclick="let p=+v('p'),d=+v('d'),ah=p*d/100;setResult('r',`Ahorro: <b>${€(ah)}</b><br>Precio final: <b>${€(p-ah)}</b>`)">Calcular</button><div id="r" class="result">Pulsa calcular.</div></div><a class="back" href="index.html">← Volver a todas las calculadoras</a></main><script src="app.js"></script></body></html>
