<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de margen de beneficio | Mi Calculadora</title><meta name="description" content="Calcula beneficio y margen a partir del coste y precio de venta."><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html">Mi Calculadora</a></div></header><main class="container calc-wrap"><div class="calc"><h1>Calculadora de margen de beneficio</h1><p>Calcula beneficio y margen a partir del coste y precio de venta.</p><div class='field'><label>Coste (€)</label><input id='c' type='number' value='60'></div><div class='field'><label>Precio de venta (€)</label><input id='p' type='number' value='100'></div><button class='btn' onclick="let c=+v('c'),p=+v('p'),b=p-c,m=b/p*100;setResult('r',`Beneficio: <b>${€(b)}</b><br>Margen: <b>${m.toFixed(2)}%</b>`)">Calcular</button><div id="r" class="result">Pulsa calcular.</div></div><a class="back" href="index.html">← Volver a todas las calculadoras</a></main><script src="app.js"></script></body></html>
