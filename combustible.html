<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de combustible | Mi Calculadora</title><meta name="description" content="Calcula el consumo y el coste estimado de un viaje."><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html">Mi Calculadora</a></div></header><main class="container calc-wrap"><div class="calc"><h1>Calculadora de combustible</h1><p>Calcula el consumo y el coste estimado de un viaje.</p><div class='field'><label>Distancia (km)</label><input id='d' type='number' value='300'></div><div class='field'><label>Consumo (L/100 km)</label><input id='l' type='number' value='6'></div><div class='field'><label>Precio combustible (€/L)</label><input id='p' type='number' value='1.60' step='0.01'></div><button class='btn' onclick="let d=+v('d'),l=+v('l'),p=+v('p'),lit=d*l/100;setResult('r',`Combustible: <b>${lit.toFixed(1)} L</b><br>Coste: <b>${€(lit*p)}</b>`)">Calcular</button><div id="r" class="result">Pulsa calcular.</div></div><a class="back" href="index.html">← Volver a todas las calculadoras</a></main><script src="app.js"></script></body></html>
