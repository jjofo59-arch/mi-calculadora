<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de regla de tres | Mi Calculadora</title><meta name="description" content="Resuelve una proporción: si A corresponde a B, ¿a cuánto corresponde C?"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html">Mi Calculadora</a></div></header><main class="container calc-wrap"><div class="calc"><h1>Calculadora de regla de tres</h1><p>Resuelve una proporción: si A corresponde a B, ¿a cuánto corresponde C?</p><div class='field'><label>A</label><input id='a' type='number' value='2'></div><div class='field'><label>B</label><input id='b' type='number' value='10'></div><div class='field'><label>C</label><input id='c' type='number' value='5'></div><button class='btn' onclick="setResult('r',`Resultado: <b>${(+v('b')*+v('c')/+v('a')).toLocaleString('es-ES')}</b>`)">Calcular</button><div id="r" class="result">Pulsa calcular.</div></div><a class="back" href="index.html">← Volver a todas las calculadoras</a></main><script src="app.js"></script></body></html>
